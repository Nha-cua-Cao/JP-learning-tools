<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ff7a6b">
<title>Blazecard  — Nhà của Cáo</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<!-- Bootstrap (chỉ dùng reset/utility nhỏ, không dùng components) -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Font Awesome icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── Header ─────────────────────────────────────────── -->
<div class="header">
  <div class="header-left">
    <!-- Nút mở sidebar (chỉ hiện trên màn hình nhỏ) -->
    <button class="menu-btn" id="menuBtn" onclick="toggleSidebar()" title="Chọn bài học" aria-label="Chọn bài học">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div class="header-brand">
      <i class="fa-solid fa-torii-gate gate-icon"></i>
      <span class="brand-text">Nhà của Cáo <span class="brand-sep">&nbsp;·&nbsp;</span> Blazecard</span>
    </div>
  </div>
  <div class="header-hint">
    <span class="kbd"><i class="fa-regular fa-rectangle-wide kbd-icon"></i>&nbsp;Space</span> Lật thẻ
    <span class="kbd">← →</span> Điều hướng
    <span class="kbd">S</span> ⭐ Gắn sao
  </div>
</div>

<!-- ── Layout: Sidebar + Main ──────────────────────────── -->
<div class="layout">

  <!-- Lớp phủ khi mở sidebar trên mobile -->
  <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

  <!-- ── Sidebar ──────────────────────────────────────── -->
  <div class="sidebar" id="sidebar">

    <!-- Tiêu đề sidebar -->
    <div class="sidebar-header">
      <span>Chọn bài học</span>
      <div class="sidebar-header-right">
        <span id="selectedCount" class="selected-count"></span>
        <!-- Nút đóng sidebar (chỉ hiện trên màn hình nhỏ) -->
        <button class="sidebar-close" onclick="closeSidebar()" title="Đóng" aria-label="Đóng">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <!-- Danh sách sách/unit có thể cuộn -->
    <div class="sidebar-scroll">
      <div id="unitSelect"></div>
    </div>

    <!-- Nút chức năng -->
    <div class="sidebar-actions">
      <!-- Bật/tắt chế độ ôn thẻ đã gắn sao -->
      <button class="btn-sidebar btn-star-mode" id="starModeBtn" onclick="toggleStarMode()">
        <i class="fa-solid fa-star"></i> Ôn thẻ đã gắn sao
      </button>
      <!-- Tải lại file data.tsv từ server -->
      <button class="btn-sidebar btn-reload" onclick="reloadData()">
        <i class="fa-solid fa-rotate"></i> Tải lại data.tsv
      </button>
      <!-- Import & Export nằm cạnh nhau -->
      <div class="btn-row">
        <button class="btn-sidebar btn-import"
                onclick="document.getElementById('fileInput').click()">
          <i class="fa-solid fa-file-import"></i> Import
        </button>
        <button class="btn-sidebar btn-export" onclick="exportStarred()">
          <i class="fa-solid fa-download"></i> Export ⭐
        </button>
      </div>
    </div>
  </div>

  <!-- ── Main ─────────────────────────────────────────── -->
  <div class="main" id="mainArea">

    <!-- Badge hiển thị khi đang ở chế độ ôn sao -->
    <div class="star-mode-badge">
      <i class="fa-solid fa-star badge-icon"></i>
      Chế độ ôn sao
    </div>

    <!-- Trạng thái chưa chọn bài (mặc định) -->
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🦊</div>
      <p>Chọn một bài học từ sidebar để bắt đầu học flashcard.</p>
    </div>

    <!-- Vùng flashcard (ẩn cho đến khi có bài) -->
    <div id="cardArea" class="card-area" style="display:none;">

      <!-- ── Flashcard ─────────────────────────────── -->
      <div class="flashcard-wrap" id="flashcard" onclick="flipCard()">
        <div class="card-inner">

          <!-- Mặt trước: hiển thị chữ và cách đọc -->
          <div class="card-face card-front">
            <!-- Chữ Kanji (có thể rỗng) -->
            <div class="card-kanji" id="kanji"></div>
            <!-- Cách đọc (Hiragana/Katakana) -->
            <div class="card-reading" id="reading"></div>

            <!-- Nút phát âm — giữa đáy thẻ -->
            <button class="speak-btn" id="speakBtn" onclick="speakCurrent(event)"
                    title="Nghe phát âm">
              <i class="fa-solid fa-volume-high"></i>
            </button>

            <!-- Nút mic kiểm tra phát âm — góc phải -->
            <button class="mic-btn" id="micBtn" onclick="checkPronunciation(event)"
                    title="Kiểm tra phát âm của bạn">
              <i class="fa-solid fa-microphone"></i>
            </button>

            <!-- Overlay hiển thị sóng âm khi đang ghi -->
            <div class="recording-overlay" id="recordingOverlay">
              <div class="recording-wave">
                <span></span><span></span><span></span><span></span><span></span>
              </div>
            </div>

            <!-- Bảng kết quả phát âm — xuất hiện sau ghi âm -->
            <div class="pronun-result" id="pronunResult">
              <!-- Nút đóng -->
              <button class="pronun-close" onclick="closePronunResult(event)"
                      title="Đóng">✕</button>

              <!-- Hàng điểm số -->
              <div class="pronun-score-row">
                <div>
                  <div class="pronun-score-caption">Độ chính xác</div>
                  <div class="pronun-score-num" id="pronunScoreNum">0%</div>
                </div>
                <span class="pronun-score-label" id="pronunScoreLabel">—</span>
              </div>

              <!-- Thanh tiến trình điểm số -->
              <div class="pronun-bar-track">
                <div class="pronun-bar-fill" id="pronunBarFill"></div>
              </div>

              <!-- Chữ người dùng đã nói -->
              <div class="pronun-spoken-row">
                <i class="fa-solid fa-microphone pronun-spoken-icon"></i>
                <span>Bạn nói:</span>
                <span class="pronun-spoken-text" id="pronunSpokenText">—</span>
              </div>
            </div>
          </div><!-- /card-front -->

          <!-- Mặt sau: nghĩa và ví dụ -->
          <div class="card-face card-back">
            <div class="card-meaning" id="meaning"></div>
            <div class="card-divider"></div>
            <div class="card-example" id="example"></div>
          </div>

        </div><!-- /card-inner -->
      </div><!-- /flashcard-wrap -->

      <!-- Thanh tiến trình và số thẻ -->
      <div class="deck-meta">
        <span class="deck-info-text" id="deckInfo"></span>
        <div class="progress-track">
          <div class="progress-fill" id="progressBar"></div>
        </div>
      </div>

      <!-- Nút điều hướng -->
      <div class="controls">
        <button class="ctrl-btn" onclick="prevCard()">
          <i class="fa-solid fa-arrow-left"></i> <span class="ctrl-label">Trước</span>
        </button>
        <button class="star-btn" id="starBtn" onclick="toggleStar()" title="Gắn sao (S)">
          <i class="fa-solid fa-star"></i>
        </button>
        <button class="ctrl-btn" onclick="nextCard()">
          <span class="ctrl-label">Tiếp</span> <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>

      <!-- Gợi ý lật thẻ -->
      <div class="flip-hint">
        <span class="hint-desktop">Nhấn vào thẻ hoặc bấm <kbd class="hint-kbd">Space</kbd> để lật</span>
        <span class="hint-touch">Chạm vào thẻ để lật</span>
      </div>

    </div><!-- /cardArea -->
  </div><!-- /main -->
</div><!-- /layout -->

<!-- Input file ẩn để import TSV -->
<input type="file" id="fileInput" accept=".tsv,.txt" hidden>

<!-- Container toast thông báo -->
<div class="toast-wrap" id="toastWrap"></div>

<script src="app.js"></script>
</body>
</html>
